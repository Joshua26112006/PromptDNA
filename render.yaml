# Render Blueprint — deploys the PromptDNA FastAPI backend as a free Web
# Service from backend/Dockerfile. In the Render dashboard: New + -> Blueprint
# -> select this repo -> Render reads this file and creates the service below.
# Variables marked `sync: false` are secrets/URLs you must fill in by hand in
# the Render dashboard after the Blueprint creates the service — they are
# never stored in this file or in git.
services:
  - type: web
    name: promptdna-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # --- secrets / deployment-specific: set these in the Render dashboard ---
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false

      # --- fixed application config (safe to store in the blueprint) ---
      - key: NEO4J_DATABASE
        value: neo4j
      - key: NEO4J_ENABLED
        value: "true"
      - key: PGVECTOR_ENABLED
        value: "true"
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: EMBEDDING_PROVIDER
        value: mock
      - key: EMBEDDING_DIMENSION
        value: "1536"
      - key: EMBEDDING_MODEL_NAME
        value: text-embedding-3-small
      - key: EMBEDDING_AUTOGENERATE
        value: "false"
      - key: ENABLE_MOCK_PROVIDER
        value: "true"
